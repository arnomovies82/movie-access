<!DOCTYPE html>
<html>
<head>
    <title>Movie Access</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        iframe {
            width: 100%;
            max-width: 700px;
            height: 400px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Watch to Continue</h1>

    <p>Watch this video for 5 minutes.</p>

    <iframe
        src="https://www.youtube.com/embed/DEvz0fdvP5s"
        title="YouTube video"
        frameborder="0"
        allowfullscreen>
    </iframe>

    <p id="timer">5:00 remaining</p>

    <button id="continueBtn" disabled>
        Continue
    </button>

</body>
</html>
