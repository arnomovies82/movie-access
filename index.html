<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arno Movies</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
        }

        .subscribe {
            display: inline-block;
            background: #ff0000;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;
            margin: 20px;
        }

        #unlockBtn {
            display: none;
            background: white;
            color: black;
            padding: 14px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>🎬 Arno Movies</h1>

<h2>Subscribe to Continue</h2>

<p>
    Step 1: Visit our YouTube channel and subscribe.
</p>

<a
    class="subscribe"
    href="https://youtube.com/@arno_movies_82"
    target="_blank"
    onclick="channelOpened()">

    🔴 Subscribe to Arno Movies

</a>

<p id="message">
    You must visit our YouTube channel first.
</p>

<button id="unlockBtn" onclick="continueToVideo()">
    ✅ Continue
</button>


<script>

function channelOpened() {

    sessionStorage.setItem(
        "channelVisited",
        "yes"
    );

}


/* Check when visitor returns */

window.addEventListener("pageshow", function() {

    checkChannel();

});


function checkChannel() {

    const visited =
        sessionStorage.getItem("channelVisited");

    if (visited === "yes") {

        document.getElementById("unlockBtn").style.display =
            "inline-block";

        document.getElementById("message").innerText =
            "✅ You visited our YouTube channel. You can continue.";

    }

}


function continueToVideo() {

    window.location.href =
        "index.html?v=movie1";

}

</script>

</body>
</html>
