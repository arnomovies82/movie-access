<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arno Movies</title>

<style>
body {
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:25px 15px;
}

h1 {
    font-size:32px;
}

.subscribe-btn,
#downloadBtn {
    display:inline-block;
    padding:16px 25px;
    border-radius:8px;
    text-decoration:none;
    font-size:19px;
    font-weight:bold;
    margin:20px 0;
}

.subscribe-btn {
    background:#ff0000;
    color:white;
}

#watchSection {
    display:none;
}

#player {
    width:100%;
    max-width:560px;
    margin:20px auto;
}

#timer {
    font-size:30px;
    margin:20px;
}

#status {
    font-size:18px;
    margin:15px;
}

#downloadBtn {
    display:none;
    background:#00c853;
    color:white;
}
</style>
</head>

<body>

<div id="subscribeSection">

<h1>🎬 Arno Movies</h1>

<h2>🔒 Subscribe to Unlock</h2>

<p>Visit our YouTube channel and subscribe.</p>

<a
class="subscribe-btn"
href="https://youtube.com/@arno_movies_82"
target="_blank"
onclick="channelClicked()">
🔴 Subscribe to Arno Movies
</a>

<p>After subscribing, return to this page.</p>

<p>🔒 Locked</p>

</div>


<div id="watchSection">

<h1>▶️ Watch to Continue</h1>

<div id="player"></div>

<div id="status">
Loading YouTube video...
</div>

<div id="timer">
5:00 remaining
</div>

<a
id="downloadBtn"
href="https://fast-dl.one/dl/3077d2"
target="_blank">

⬇️ Download Movie

</a>

</div>


<script>

function channelClicked() {
    sessionStorage.setItem(
        "arnoChannelVisited",
        "true"
    );
}


function checkChannelVisit() {

    if (
        sessionStorage.getItem(
            "arnoChannelVisited"
        ) === "true"
    ) {

        document.getElementById(
            "subscribeSection"
        ).style.display = "none";

        document.getElementById(
            "watchSection"
        ).style.display = "block";

        loadYouTube();

    }

}


let player;
let isPlaying = false;
let timeLeft = 300;
let finished = false;


function loadYouTube() {

    player = new YT.Player(
        "player",
        {
            width:"560",
            height:"315",

            videoId:"DEvz0fdvP5s",

            playerVars:{
                rel:0
            },

            events:{

                onReady:function() {

                    document.getElementById(
                        "status"
                    ).innerText =
                    "Press Play to start.";

                },

                onStateChange:function(event) {

                    if (
                        event.data ===
                        YT.PlayerState.PLAYING
                    ) {

                        isPlaying = true;

                        document.getElementById(
                            "status"
                        ).innerText =
                        "Video playing — timer running";

                    }
                    else {

                        isPlaying = false;

                        if (!finished) {

                            document.getElementById(
                                "status"
                            ).innerText =
                            "Video paused — timer stopped";

                        }

                    }

                }

            }

        }
    );

}


setInterval(function() {

    if (
        isPlaying &&
        timeLeft > 0 &&
        !finished
    ) {

        timeLeft--;

        let minutes =
        Math.floor(timeLeft / 60);

        let seconds =
        timeLeft % 60;

        document.getElementById(
            "timer"
        ).innerText =
        minutes + ":" +
        (seconds < 10 ? "0" : "") +
        seconds +
        " remaining";

    }


    if (
        timeLeft <= 0 &&
        !finished
    ) {

        finished = true;
        isPlaying = false;

        document.getElementById(
            "timer"
        ).innerText =
        "✅ 5 minutes completed!";

        document.getElementById(
            "status"
        ).innerText =
        "Download unlocked!";

        document.getElementById(
            "downloadBtn"
        ).style.display =
        "inline-block";

    }

},1000);


/* LOAD YOUTUBE API */

let youtubeScript =
document.createElement("script");

youtubeScript.src =
"https://www.youtube.com/iframe_api";

document.head.appendChild(
    youtubeScript
);


window.onYouTubeIframeAPIReady =
function() {

    checkChannelVisit();

};

</script>

</body>
</html>
