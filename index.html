<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arno Movies</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 25px 15px;
}

h1 {
    font-size: 32px;
}

.subscribe-btn,
#downloadBtn {
    display: inline-block;
    color: white;
    padding: 16px 25px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 19px;
    font-weight: bold;
    margin: 20px 0;
}

.subscribe-btn {
    background: #ff0000;
}

#downloadBtn {
    display: none;
    background: #00c853;
}

#watchSection {
    display: none;
}

#player {
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
}

#timer {
    font-size: 30px;
    margin: 20px;
}

#status {
    font-size: 18px;
    margin: 15px;
}

button {
    padding: 14px 25px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
}
</style>
</head>

<body>

<!-- STEP 1 -->
<div id="subscribeSection">

<h1>🎬 Arno Movies</h1>

<h2>🔒 Subscribe to Unlock</h2>

<p>Visit our YouTube channel and subscribe.</p>

<a
class="subscribe-btn"
href="https://youtube.com/@arno_movies_82"
target="_blank"
onclick="channelClicked()">

🔴 Subscribe to Arno Movies

</a>

<p>After subscribing, return to this page.</p>

<p>🔒 Locked</p>

</div>


<!-- STEP 2 -->
<div id="watchSection">

<h1>▶️ Watch to Continue</h1>

<div id="player"></div>

<div id="status">
Press Play to start.
</div>

<div id="timer">
5:00 remaining
</div>


<!-- DOWNLOAD BUTTON -->

<a
id="downloadBtn"
href="https://fast-dl.one/dl/3077d2"
target="_blank">

⬇️ Download Movie

</a>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

const movieName =
new URLSearchParams(window.location.search).get("v")
|| "movie1";


/* CHANNEL VISIT */

function channelClicked() {

    sessionStorage.setItem(
        "arnoChannelVisited",
        "true"
    );

}


/* CHECK CHANNEL VISIT */

function checkChannelVisit() {

    const visited =
    sessionStorage.getItem(
        "arnoChannelVisited"
    );

    if (visited === "true") {

        document.getElementById(
            "subscribeSection"
        ).style.display = "none";

        document.getElementById(
            "watchSection"
        ).style.display = "block";

    }

}


/* YOUTUBE VIDEO */

let player;

let isPlaying = false;

let timeLeft = 300;

let finished = false;


function onYouTubeIframeAPIReady() {

    player = new YT.Player(
        "player",
        {
            width: "560",
            height: "315",

            videoId: "DEvz0fdvP5s",

            playerVars: {
                rel: 0
            },

            events: {

                onStateChange:
                function(event) {

                    if (
                        event.data ===
                        YT.PlayerState.PLAYING
                    ) {

                        isPlaying = true;

                        document.getElementById(
                            "status"
                        ).innerText =
                        "Video playing — timer running";

                    }

                    else {

                        isPlaying = false;

                        if (!finished) {

                            document.getElementById(
                                "status"
                            ).innerText =
                            "Video paused — timer stopped";

                        }

                    }

                }

            }

        }
    );

}


/* TIMER */

setInterval(
function() {

    if (
        isPlaying &&
        timeLeft > 0 &&
        !finished
    ) {

        timeLeft--;

        const minutes =
        Math.floor(timeLeft / 60);

        const seconds =
        timeLeft % 60;

        const displaySeconds =
        seconds < 10
        ? "0" + seconds
        : seconds;

        document.getElementById(
            "timer"
        ).innerText =
        minutes +
        ":" +
        displaySeconds +
        " remaining";

    }


    /* AFTER 5 MINUTES */

    if (
        timeLeft <= 0 &&
        !finished
    ) {

        finished = true;

        isPlaying = false;


        document.getElementById(
            "timer"
        ).innerText =
        "✅ 5 minutes completed!";


        document.getElementById(
            "status"
        ).innerText =
        "Download unlocked!";


        /* SHOW DOWNLOAD BUTTON */

        document.getElementById(
            "downloadBtn"
        ).style.display =
        "inline-block";

    }

},
1000);


/* START */

checkChannelVisit();

</script>

</body>
</html>
