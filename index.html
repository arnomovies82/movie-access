<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arno Movies</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
        }

        .subscribe-btn {
            display: inline-block;
            background: #ff0000;
            color: white;
            padding: 16px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            margin: 25px 0;
        }

        #locked {
            display: block;
        }

        #unlocked {
            display: none;
        }

        .continue-btn {
            background: white;
            color: black;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="locked">

    <h1>🎬 Arno Movies</h1>

    <h2>🔒 Subscribe to Unlock</h2>

    <p>
        Visit our YouTube channel and subscribe.
    </p>

    <a
        class="subscribe-btn"
        href="https://youtube.com/@arno_movies_82"
        target="_blank"
        onclick="markVisited()">

        🔴 Subscribe to Arno Movies

    </a>

    <p>
        After subscribing, come back to this page.
    </p>

</div>


<div id="unlocked">

    <h1>✅ Unlocked</h1>

    <p>
        You visited our YouTube channel.
    </p>

    <button
        class="continue-btn"
        onclick="goNext()">

        Continue

    </button>

</div>


<script>

function markVisited() {

    sessionStorage.setItem(
        "arnoChannelVisited",
        "true"
    );

}


function checkVisited() {

    if (
        sessionStorage.getItem("arnoChannelVisited")
        === "true"
    ) {

        document.getElementById("locked").style.display =
            "none";

        document.getElementById("unlocked").style.display =
            "block";

    }

}


function goNext() {

    window.location.href =
        "index.html?v=movie1";

}


checkVisited();

</script>

</body>
</html>
