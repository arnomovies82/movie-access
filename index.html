<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arno Movies</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
        }

        h1 {
            font-size: 32px;
        }

        .subscribe {
            display: inline-block;
            background: #ff0000;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;
            margin: 20px 0;
        }

        .subscribe:hover {
            background: #cc0000;
        }

        .confirm {
            display: block;
            margin: 15px auto;
            padding: 14px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🎬 Arno Movies</h1>

    <h2>Subscribe to Continue</h2>

    <p>
        Subscribe to our YouTube channel to continue.
    </p>

    <a
        class="subscribe"
        href="https://youtube.com/@arno_movies_82"
        target="_blank">
        🔴 Subscribe to Arno Movies
    </a>

    <button
        class="confirm"
        onclick="continueToVideo()">
        ✅ I Have Subscribed
    </button>


    <script>

        function continueToVideo() {

            window.location.href =
                "watch.html?v=movie1";

        }

    </script>

</body>
</html>
