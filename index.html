<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arno Movies</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            margin: 10px;
            cursor: pointer;
        }
        #subscribeBtn {
            background: #ff0000;
            color: white;
        }
        #continueBtn {
            background: #ffffff;
            color: black;
        }
        #continueBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>🎬 Arno Movies</h1>
    <h2>Subscribe to Continue</h2>
    <p>
        Please subscribe to our YouTube channel before continuing.
    </p>
    <button id="subscribeBtn">
        🔴 Subscribe to Arno Movies
    </button>
    <br>
    <button id="continueBtn" disabled>
        ✅ I Have Subscribed
    </button>
<script>
document.getElementById("subscribeBtn").onclick = function() {
    window.open(
        "https://youtube.com/@arno_movies_82",
        "_blank"
    );
    document.getElementById("continueBtn").disabled = false;
};
document.getElementById("continueBtn").onclick = function() {
    alert("Subscription step completed!");
};
</script>
</body>
</html>
