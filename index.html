<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Access</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        #player {
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
        }

        #timer {
            font-size: 28px;
            margin: 20px;
        }

        #status {
            font-size: 18px;
            margin: 15px;
        }

        button {
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<h1>Watch Video to Continue</h1>

<div id="player"></div>

<div id="status">Loading video...</div>

<div id="timer">5:00 remaining</div>

<button id="continueBtn" disabled>
    Continue
</button>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =====================================================
   EDIT ONLY THIS SECTION
   ===================================================== */

const movies = {

    movie1: {
        youtube: "DEvz0fdvP5s"
    },

    movie2: {
        youtube: "YOUR_MOVIE_2_YOUTUBE_ID"
    },

    movie3: {
        youtube: "YOUR_MOVIE_3_YOUTUBE_ID"
    }

};


/* =====================================================
   DON'T EDIT BELOW THIS LINE
   ===================================================== */

const urlParams = new URLSearchParams(window.location.search);

const movieName = urlParams.get("v") || "movie1";

const selectedMovie = movies[movieName];


if (!selectedMovie) {

    document.body.innerHTML =
        "<h1>Video not found</h1>";

} else {

    let player;

    let timeLeft = 300;

    let isPlaying = false;

    let finished = false;


    function onYouTubeIframeAPIReady() {

        player = new YT.Player("player", {

            width: "560",

            height: "315",

            videoId: selectedMovie.youtube,

            playerVars: {
                rel: 0
            },

            events: {

                onReady: function() {

                    document.getElementById("status").innerText =
                        "Press Play to start";

                },

                onStateChange: function(event) {

                    if (event.data === YT.PlayerState.PLAYING) {

                        isPlaying = true;

                        document.getElementById("status").innerText =
                            "Video playing — timer running";

                    }

                    else {

                        isPlaying = false;

                        if (!finished) {

                            document.getElementById("status").innerText =
                                "Video paused — timer stopped";

                        }

                    }

                }

            }

        });

    }


    setInterval(function() {

        if (isPlaying && timeLeft > 0 && !finished) {

            timeLeft--;

            let minutes =
                Math.floor(timeLeft / 60);

            let seconds =
                timeLeft % 60;

            let displaySeconds =
                seconds < 10
                ? "0" + seconds
                : seconds;

            document.getElementById("timer").innerText =
                minutes + ":" + displaySeconds + " remaining";

        }


        if (timeLeft <= 0 && !finished) {

            finished = true;

            isPlaying = false;

            document.getElementById("timer").innerText =
                "5 minutes completed!";

            document.getElementById("status").innerText =
                "You can continue.";

            document.getElementById("continueBtn").disabled =
                false;

        }

    }, 1000);


    document.getElementById("continueBtn").onclick = function() {

        window.location.href =
            "watch.html?v=" + encodeURIComponent(movieName);

    };

}

</script>

</body>
</html>
