<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Arno Movies</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        #subscribeBox {
            margin: 30px auto;
        }
        #continueBtn {
            padding: 14px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            color: black;
        }
        #continueBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>🎬 Arno Movies</h1>
    <h2>Subscribe to Continue</h2>
    <p>
        Please subscribe to our YouTube channel.
    </p>
    <!-- OFFICIAL YOUTUBE SUBSCRIBE BUTTON -->
    <div id="subscribeBox">
        <div class="g-ytsubscribe"
             data-channelid="UC-_nr3xQDeoMjZjcklJ2JiA"
             data-layout="full"
             data-theme="dark"
             data-count="default">
        </div>
    </div>
    <br>
    <button id="continueBtn" disabled>
        Continue
    </button>
    <!-- YOUTUBE SUBSCRIBE WIDGET -->
    <script src="https://apis.google.com/js/platform.js"></script>
    <script>
        /*
        IMPORTANT:
        The official YouTube button does NOT provide
        your website with the subscriber's status.
        Therefore this button cannot automatically
        unlock the page after subscription.
        */
        document.getElementById("continueBtn").onclick = function() {
            window.location.href =
                "watch.html?v=movie1";
        };
    </script>
</body>
</html>
