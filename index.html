<!DOCTYPE html>
<html>
<head>
    <title>Movie Access</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        iframe {
            width: 100%;
            max-width: 700px;
            height: 400px;
            border: none;
        }

        #timer {
            font-size: 24px;
            margin: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Watch to Continue</h1>

    <p>Watch the video before continuing.</p>

    <iframe
        src="https://www.youtube.com/embed/DEvz0fdvP5s"
        title="YouTube video"
        allowfullscreen>
    </iframe>

    <div id="timer">5:00</div>

    <button id="continueBtn" disabled>
        Continue
    </button>

    <script>
        let timeLeft = 300;

        const timer = document.getElementById("timer");
        const button = document.getElementById("continueBtn");

        const countdown = setInterval(function() {

            timeLeft--;

            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;

            seconds = seconds < 10 ? "0" + seconds : seconds;

            timer.innerText = minutes + ":" + seconds;

            if (timeLeft <= 0) {
                clearInterval(countdown);

                timer.innerText = "You can continue!";
                button.disabled = false;
            }

        }, 1000);

        button.onclick = function() {
            window.location.href = "movie1.html";
        };
    </script>

</body>
</html>
